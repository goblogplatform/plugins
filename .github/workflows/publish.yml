name: Publish index
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.build.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the index
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go build -o "$RUNNER_TEMP/registry" ./cmd/registry
          set +e
          "$RUNNER_TEMP/registry" build --out dist --image compscidr/goblog:v0.2.7
          code=$?
          set -e
          if [ "$code" = "2" ]; then echo "skipped=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  report-skipped:
    needs: [build, deploy]
    if: needs.build.outputs.skipped == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Some registry entries were skipped; see the build job log."
          exit 1
